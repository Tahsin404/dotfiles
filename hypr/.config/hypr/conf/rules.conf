# ~/.config/hypr/conf/rules.conf
# ==============================================================================
# WINDOW & LAYER RULES
# ==============================================================================

layerrule {
    name = blur-gtk-shell
    match:namespace = gtk-layer-shell
    blur = true
    blur_popups = true
    ignore_alpha = 0.3
}

layerrule {
    name = blur-waybar
    match:namespace = waybar
    blur = true
    ignore_alpha = 0
}

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = gamescope
    match:class = ^(gamescope)$
    fullscreen = true
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = zoom-annotation-canvas
    match:class = zoom
    match:title = Annotation - Zoom
    no_initial_focus = on
    float = 1
    exec = sleep 0.3 && xdotool search --name "Annotation - Zoom" windowlower
}

windowrule {
    name = zoom-toolbars
    match:class = zoom
    match:title = annotate_toolbar
    float = 1
}

windowrule {
    name = zoom-as-toolbar
    match:class = zoom
    match:title = as_toolbar
    float = 1
}

windowrule {
    name = zoom-overlay
    match:class = zoom
    match:title = zoom
    no_focus = on
    float = 1
}

windowrule {
    name = zoom-effects
    match:class = zoom
    no_blur = on
    no_shadow = on
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}
