# ~/.config/hypr/conf/appearance.conf
# ==============================================================================
# APPEARANCE & THEMING
# ==============================================================================

# Source our static color file
source = ~/.config/hypr/conf/colors.conf

general {
    gaps_in = 5
    gaps_out = 5, 10
    border_size = 0

    col.active_border = $active_border
    col.inactive_border = $inactive_border

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
    no_focus_fallback = true
}

decoration {
    rounding = 15
    rounding_power = 1.9

    active_opacity = 1
    inactive_opacity = 0.4

    shadow {
        enabled = true
        range = 2
        render_power = 6
        color = $shadow_color 
    }

    blur {
        enabled = true
        size = 2
        passes = 5
        vibrancy = 0.1696
        new_optimizations = true
        ignore_opacity = true
        xray = false
        noise = 0.03
    }
}
# (Keep your existing animations {} block here)

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)
    workspace_wraparound = true
    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = bubbly,         0.55, -0.68,0.48, 1.68
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     17,    easeOutQuint
    animation = windowsIn,     1,     18,    easeOutQuint, popin 0%
    animation = windowsOut,    1,     14,    easeOutQuint, popin 0%
    animation = fadeIn,        1,     4,     easeOutQuint
    animation = fadeOut,       1,     6,     easeOutQuint
    animation = fadeSwitch,    1,     5,     easeOutQuint
    animation = fade,          1,     1.5,   quick
    animation = fadePopupsIn,  1,     4,     easeOutQuint
    animation = layers,        1,     5,    bubbly, popin 50%
    animation = layersIn,      1,     5,    bubbly, popin 50%
    animation = layersOut,     1,     5,    bubbly, popin 0%
    animation = fadeLayersIn,  1,     10,    easeInOutCubic, 
    animation = fadeLayersOut, 1,     10,     easeInOutCubic
    animation = workspaces,    1,     9,     easeInOutCubic 
    animation = workspacesIn,  1,     9,     easeInOutCubic 
    animation = workspacesOut, 1,     9,     easeInOutCubic 
    animation = zoomFactor,    1,     7,     quick
}
