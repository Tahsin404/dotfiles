# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,auto

###################
### MY PROGRAMS ###
###################

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
$menu = wofi

# ==============================================================================
# SOURCED MODULES
# ==============================================================================
source = ~/.config/hypr/conf/env.conf
source = ~/.config/hypr/conf/autostart.conf
source = ~/.config/hypr/conf/colors.conf
source = ~/.config/hypr/conf/appearance.conf
source = ~/.config/hypr/conf/rules.conf
source = ~/.config/hypr/conf/input.conf
source = ~/.config/hypr/conf/keybinds.conf

###################
### PERMISSIONS ###
###################

permission = /usr/(bin|local/bin)/grim, screencopy, allow
permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

#########################
### PLUGIN SETTINGS   ###
#########################

plugin {
        hyprtrails {
                color = rgba(F5D1A4ac)
        }
}

plugin:dynamic-cursors {
    enabled = true
    mode = stretch
    threshold = 2
    stretch {
        limit = 3000
        function = negative_quadratic
        window = 100
    }
}
