# ~/.config/hypr/hyprlock.conf
# Caelestia Lock Screen - Final Block Layout

# --- VARIABLES ---
$text_main = rgba(dfdad2ff)
$text_muted = rgba(9c9893ff)
$accent = rgba(C5BAA8ff)
$glass_bg = rgba(34302c44)       
$glass_border = rgba(dfdad222)
$font_main = CodeNewRoman Nerd Font
$font_mono = BigBlueTermPlus Nerd Font

# --- BACKGROUND ---
background {
    monitor =
    path = /home/XeLiuS/.config/quickshell/assets/images/1325118.png
    blur_passes = 3
    blur_size = 4
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# ==========================================
# LEFT COLUMN: STRUCTURED CLOCK
# ==========================================
# The Tighter Solid Box
shape {
    monitor =
    size = 350, 500
    color = $glass_bg
    rounding = 30
    border_size = 2
    border_color = $glass_border
    position = 80, 0
    halign = left
    valign = center
}

# Architectural Vertical Accent Line
shape {
    monitor =
    size = 3, 400
    color = $accent
    position = 110, 0
    halign = left
    valign = center
}

# Hours
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%H")</b>"
    color = $text_main
    font_size = 85
    font_family = $font_main
    position = 180, 90
    halign = left
    valign = center
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%M")</b>"
    color = $accent
    font_size = 85
    font_family = $font_main
    position = 180, -20
    halign = left
    valign = center
}

# Day
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%A")</b>"
    color = $text_main
    font_size = 14
    font_family = $font_main
    position = 190, -90
    halign = left
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%d %B")"
    color = $text_muted
    font_size = 12
    font_family = $font_main
    position = 190, -110
    halign = left
    valign = center
}


# ==========================================
# CENTER COLUMN: LOGIN WIDGET
# ==========================================
# Avatar (Restored to Perfect Circle with your exact coordinates)
image {
    monitor =
    path = /home/XeLiuS/.config/quickshell/assets/images/1325118.png
    size = 150
    border_size = 2
    border_color = $accent
    position = 0, 60
    halign = center
    valign = center
    rounding = -1 
}

# Username
label {
    monitor =
    text = XeLiuS
    color = $text_main
    font_size = 16
    font_family = $font_main
    position = 0, -40
    halign = center
    valign = center
    shadow_passes = 1
}

# Password Field
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    
    outer_color = $glass_border
    inner_color = $glass_bg
    font_color = $text_main
    
    fade_on_empty = false
    placeholder_text = <i><span foreground="##9c9893">Password...</span></i>
    hide_input = false
    
    position = 0, -90
    halign = center
    valign = center
}


# ==========================================
# RIGHT COLUMN: QUICKSHELL MIRROR LAYOUT
# ==========================================

# --- 1. MEDIA PLAYER ---
# Main Tall Media Box
shape {
    monitor =
    size = 380, 600
    color = $glass_bg
    rounding = 30
    border_size = 2
    border_color = $glass_border
    position = -80, 0
    halign = right
    valign = center
}

# Album Art Container
shape {
    monitor =
    size = 340, 360
    rounding = 20
    color = $glass_border
    border_size = 2
    border_color = $accent
    position = -100, 100
    halign = right
    valign = center
}

# Music Icon (Centered perfectly inside the Album Art Container)
label {
    monitor =
    text = 
    color = $text_main
    font_size = 50
    font_family = $font_main
    position = -245, 120
    halign = right
    valign = center
}

# Track Title
label {
    monitor =
    text = cmd[update:1000] echo "$(playerctl metadata --format '{{title}}' 2>/dev/null || echo 'No Media Playing')"
    color = $text_main
    font_size = 16
    font_family = $font_main
    position = -100, -100
    halign = right
    valign = center
}

# Artist Name
label {
    monitor =
    text = cmd[update:1000] echo "$(playerctl metadata --format '{{artist}}' 2>/dev/null || echo 'Waiting for playback...')"
    color = $accent
    font_size = 14
    font_family = $font_main
    position = -100, -125
    halign = right
    valign = center
}


# --- 2. VOLUME ---
# Separated Volume Icon Circle
shape {
    monitor =
    size = 50, 50
    rounding = 25
    color = $glass_bg
    border_size = 2
    border_color = $accent
    position = -380, -190
    halign = right
    valign = center
}

# Volume Icon (Math fixed to align exactly dead center inside the circle)
label {
    monitor =
    text = 
    color = $text_main
    font_size = 18
    font_family = $font_main
    position = -403, -190
    halign = right
    valign = center
}

# Volume Bar Background
shape {
    monitor =
    size = 270, 50
    color = $glass_bg
    rounding = 25
    border_size = 2
    border_color = $glass_border
    position = -95, -190
    halign = right
    valign = center
}

# Volume Text Slider
label {
    monitor =
    text = cmd[update:500] awk -v vol="$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2 * 100)}')" 'BEGIN { b=int(vol/9); if(b==10) b=9; for(i=0;i<b;i++) printf "━"; printf ""; for(i=b+1;i<10;i++) printf "━", vol }'
    color = $text_main
    font_size = 14
    font_family = $font_mono
    position = -120, -190
    halign = right
    valign = center
}


